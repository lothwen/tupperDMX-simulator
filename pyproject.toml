[project]
name = "tupperdmx-simulator"
version = "0.1.0"
description = "PyQt6-based lighting control application that synchronizes MP3 audio playback with MIDI-triggered DMX lighting sequences"
requires-python = ">=3.13"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.5",
    "mido>=1.3.3",
    "mutagen>=1.47.0",
    "pyartnet>=1.0.1",
    "pylibftdi>=0.23.0",
    "pyqt6>=6.9.1",
    "pyserial>=3.5",
    "python-rtmidi>=1.5.8",
]

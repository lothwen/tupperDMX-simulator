[project]
name = "tupperdmx-simulator"
version = "1.0.0"
description = "PyQt6-based lighting control application that synchronizes MP3 audio playback with MIDI-triggered DMX lighting sequences"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.1",
    "librosa>=0.11.0",
    "matplotlib>=3.10.5",
    "mido>=1.3.3",
    "mutagen>=1.47.0",
    "piper-tts>=1.4.2",
    "platformdirs>=4.9.6",
    "pyartnet>=1.0.1",
    "pyqt6>=6.8,<6.9",
    "pyqt6-qt6>=6.8,<6.9",
    "pyserial>=3.5",
    "python-rtmidi>=1.5.8",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
    "pyinstaller-hooks-contrib",
]

[project.scripts]
tupperdmx = "main:main"

[tool.pyinstaller]
name = "TupperDMX-Simulator"
entry-points = ["main.py"]
console = false
icon = "assets/icons/metronome_icon.png"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# Put the project root on sys.path so tests `import config` / `midi...`
# without a per-file sys.path hack.
pythonpath = ["."]
testpaths = ["tests"]

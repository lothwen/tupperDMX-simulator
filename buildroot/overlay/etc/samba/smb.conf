# TupperDMX rack box: one guest-writable share, no accounts, no printers.
#
# S91smb (shipped by buildroot's samba4 package) starts smbd and nmbd at boot
# -- but only if THIS file exists, which is the whole reason it is here.
# nmbd is what makes \\TUPPERDMX resolve on a stage LAN with no DNS.

[global]
	workgroup = WORKGROUP
	netbios name = TUPPERDMX
	server string = TupperDMX

	# No accounts at all: an unknown user -- i.e. everyone -- is mapped to
	# the guest account instead of being asked for a password. "Bad User"
	# rather than "Bad Password" so a client offering any username still
	# gets in rather than being rejected.
	security = user
	map to guest = Bad User
	guest account = nobody

	# SMB1 stays off (the samba >= 4.11 default). Note that Windows 10/11
	# refuse guest logons over SMB2/3 unless AllowInsecureGuestAuth is
	# enabled client-side; Linux and macOS clients connect as-is.
	server min protocol = SMB2

	# There is no printing subsystem on this box.
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	# /var/log is a symlink into tmpfs in this rootfs, so the logs are
	# volatile by design; S91smb recreates the directory on every boot.
	log file = /var/log/samba/log.%m
	max log size = 50

	# A rack box should not take part in browser elections or serve WINS.
	local master = no
	preferred master = no
	dns proxy = no

[tupperdmx]
	comment = TupperDMX data (logs, preferences, shows)
	path = /mnt/tupperdmx
	browseable = yes
	writable = yes
	guest ok = yes
	guest only = yes
	# userprefs.json sits in .config/tupperDMX/, and samba hides dot files by
	# default -- which would put the preferences out of reach of exactly the
	# clients this share exists for.
	hide dot files = no
	# Everything happens as root, so whatever a client drops here is
	# readable and writable by the app, which also runs as root.
	force user = root
	force group = root
	create mask = 0664
	directory mask = 0775
